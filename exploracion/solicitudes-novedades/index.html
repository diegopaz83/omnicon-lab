<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Boceto Solicitudes y novedades</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>

/* Layout: cabecera, pestanas por rol (Resumen, Nueva, Mis solicitudes, Por revisar, Centro de Planeacion, Impacto, Reglas) y vistas en tarjetas y grillas.
   Tokens del Ecosistema (design/planeacion-v1). */
:root {
  color-scheme: light;
  --font: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --navy: #001c3f; --bright: #0a58eb; --cyan: #00dcfa; --cyan-ink: #007f93;
  --bg: #f2f5f9; --surface: #fff; --surface-2: #f6f8fb; --ink: #001c3f; --muted: #556578; --line: #dbe2ea; --line-2: #eef2f6;
  --primary: #002473; --primary-ink: #fff; --primary-soft: #e8eefc; --focus: #0a58eb;
  --ok-bg: #e5f7ee; --ok-ink: #145a37; --warn-bg: #fff4e0; --warn-ink: #7a4a00; --err-bg: #fbeaeb; --err-ink: #b0353c;
  --approval: #7543ff; --approval-soft: #f1ecff; --off-bg: #e9edf2; --off-ink: #8593a5;
  --res: #7aa7ff; --res-soft: #e8f0ff;
  --shadow: 0 12px 32px rgba(0,28,63,.18); --shadow-sm: 0 2px 8px rgba(0,28,63,.08);
  --r-ctl: 8px; --r-surf: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --res: #4f7fd6; --res-soft: #15284a;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff; --cyan-ink: #5fe6fb;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #5f738c; --navy: #020c1a;
  --res: #4f7fd6; --res-soft: #15284a;
  --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1320px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
/* Embebido en Configuracion (Semanas bloqueadas): sin margenes propios */
html.emb body { background: transparent; }
html.emb .wrap { max-width: none; padding: 0; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.head p { color: var(--muted); font-size: 13px; max-width: 72ch; }
.scope { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

.tabs { position: relative; display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { padding: 10px 14px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-color: var(--cyan); }
.count { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); }
.count.ap { background: var(--approval-soft); color: var(--approval); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-ctl); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.ghost { border: 1px solid var(--line); background: var(--surface); }
.btn.ghost:hover:not(:disabled) { border-color: var(--bright); }
.btn.approve { background: var(--approval); color: #fff; }
.btn.danger { border: 1px solid var(--err-ink); color: var(--err-ink); background: var(--surface); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.link { color: var(--bright); font-weight: 500; font-size: 13px; }
.link:hover { text-decoration: underline; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--off-bg); color: var(--off-ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.err { background: var(--err-bg); color: var(--err-ink); }
.pill.pri { background: var(--primary-soft); color: var(--primary); }
.pill.ap { background: var(--approval-soft); color: var(--approval); }
.pill.prop { background: transparent; border: 1px dashed var(--approval); color: var(--approval); }
.pill.sim { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.pill .ic { width: 12px; height: 12px; }
.muted { color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

.banner { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-surf); border: 1px solid var(--line); background: var(--surface); }
.banner .txt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.banner b { font-weight: 600; font-size: 13.5px; }
.banner span { font-size: 12.5px; color: var(--muted); }
.banner.warn { background: var(--warn-bg); border-color: transparent; }
.banner.warn b, .banner.warn span { color: var(--warn-ink); }
.banner.ap { background: var(--approval-soft); border-color: transparent; }
.banner.ap b, .banner.ap span { color: var(--approval); }
.banner.ok { background: var(--ok-bg); border-color: transparent; }
.banner.ok b, .banner.ok span { color: var(--ok-ink); }
.banner.err { background: var(--err-bg); border-color: transparent; }
.banner.err b, .banner.err span { color: var(--err-ink); }
.banner .b-ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.06); flex: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.card-h h2 { font-size: 15px; font-weight: 600; }
.card-h p { font-size: 12.5px; color: var(--muted); max-width: 80ch; }

/* ---------- Solicitudes y novedades · boceto iteracion 1 ---------- */
.av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; background: var(--navy); display: inline-flex; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av .ini { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 12px; }
.av.sm { width: 24px; height: 24px; } .av.sm .ini { font-size: 10px; }
.av.xs { width: 20px; height: 20px; } .av.xs .ini { font-size: 9px; }
.av.lg { width: 44px; height: 44px; }
.boceto { font-size: 11.5px; font-weight: 600; color: var(--approval); border: 1px dashed var(--approval); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.head-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; }
.code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; font-weight: 500; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }

/* Resumen: banda con saldos y acciones */
.hero { background: var(--navy); color: #fff; border-radius: var(--r-surf); padding: 20px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 24px; align-items: end; }
.hero h2 { font-size: 20px; font-weight: 600; } .hero p { color: #b8c6dd; font-size: 13px; max-width: 60ch; margin-top: 4px; }
.bal { display: flex; gap: 10px; flex-wrap: wrap; }
.bal > div { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 10px 14px; min-width: 150px; }
.bal small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #b8c6dd; }
.bal b { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; }
.bal span { font-size: 11.5px; color: #b8c6dd; }
.acts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.agrp { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.agrp h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.atiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.atile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 112px; transition: border-color .15s, box-shadow .15s; }
.atile:hover { border-color: var(--bright); box-shadow: var(--shadow-sm); }
.atile .ti { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); }
.atile .ti .ic { width: 18px; height: 18px; }
.atile.nov .ti { background: var(--surface-2); color: var(--ink); }
.atile b { font-size: 13.5px; font-weight: 600; } .atile small { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.atile.ext { border-style: dashed; }

/* Lista estandar (grilla) */
.tbl { border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); overflow: hidden; }
.tr { display: grid; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line-2); min-width: 0; }
.tr:last-child { border-bottom: 0; }
.tr.th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; padding-block: 9px; border-bottom: 1px solid var(--line); }
.tr.click { cursor: pointer; } .tr.click:hover { background: color-mix(in srgb, var(--primary-soft) 50%, var(--surface)); }
.tr.sel { background: var(--primary-soft); }
.tr > * { min-width: 0; }
.tr .r { text-align: right; }
.cols-mine { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.2fr) minmax(0, 1.5fr) 150px 22px; }
.cols-pl { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.3fr) 110px 150px; }
.grid2.plg { grid-template-columns: minmax(0, 1.5fr) minmax(340px, 1fr); }
.pipe.nar { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pipe.nar > div:nth-child(3) { border-left: 0; } .pipe.nar > div:nth-child(n+3) { border-top: 1px solid var(--line-2); }
.imp.nar > div { grid-template-columns: minmax(0, 1fr) auto; } .imp.nar > div > :nth-child(3) { grid-column: 1 / -1; }
.who > div { min-width: 0; }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.who b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tchip { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 500; }
.tchip .ic { width: 15px; height: 15px; color: var(--muted); }
.dates b { display: block; font-size: 13px; font-weight: 500; } .dates small { display: block; font-size: 11.5px; color: var(--muted); }
.ldrs { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.ld { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px 1px 2px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.ld .ic { width: 12px; height: 12px; }
.ld.ok { border-color: transparent; background: var(--ok-bg); color: var(--ok-ink); }
.ld.obs { border-color: transparent; background: var(--warn-bg); color: var(--warn-ink); }
.ld.pend { border-style: dashed; color: var(--muted); }
.ld.aviso { color: var(--muted); }
.cf { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--err-ink); font-weight: 500; }
.cf .ic { width: 14px; height: 14px; }
.chev { transition: transform .15s; color: var(--muted); }
.open .chev { transform: rotate(180deg); }

/* Pipeline Solicitud -> Aprobacion -> Disponibilidad -> Ejecucion */
.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.pipe > div { padding: 10px 12px; border-left: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; }
.pipe > div:first-child { border-left: 0; }
.pipe small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.pipe b { font-size: 12.5px; font-weight: 600; } .pipe span { font-size: 11.5px; color: var(--muted); }
.pipe .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.pipe .done .dot { background: var(--ok-ink); } .pipe .now .dot { background: var(--approval); box-shadow: 0 0 0 3px var(--approval-soft); }
.pipe .tent .dot { background: transparent; border: 2px dashed var(--approval); }
.pipe .no .dot { background: var(--err-ink); }
.pipe .now { background: color-mix(in srgb, var(--approval-soft) 55%, var(--surface)); }

.det { padding: 14px; background: var(--surface-2); border-bottom: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 12px; }
.det h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.imp { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.imp > div { display: grid; grid-template-columns: minmax(0, 1.4fr) 80px minmax(0, 1.4fr); gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line-2); }
.imp > div:last-child { border-bottom: 0; }
.ceco { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.ceco b { display: block; font-family: ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; }
.ceco small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ceco > span:last-child { min-width: 0; }
.resp { font-size: 12px; } .resp q { color: var(--ink); font-style: italic; quotes: '«' '»'; }
.hist { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.hist div { display: flex; gap: 8px; } .hist time { color: var(--muted); min-width: 64px; }
.lock { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; color: var(--muted); }
.lock .ic { width: 12px; height: 12px; }

/* Nueva solicitud */
.tpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tp { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; text-align: left; display: flex; gap: 10px; align-items: center; }
.tp .ic { width: 18px; height: 18px; color: var(--muted); }
.tp[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.tp[aria-pressed="true"] .ic { color: var(--primary); }
.tp span { font-size: 13px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form .full { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.fld .f, .f { border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); padding: 8px 10px; font-size: 13px; color: var(--ink); min-width: 0; width: 100%; }
textarea.f { min-height: 64px; resize: vertical; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.drop { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.drop.has { border-style: solid; color: var(--ink); background: var(--ok-bg); border-color: transparent; }
.calc { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; }
.calc b { font-size: 15px; display: block; }
.what { position: sticky; top: 12px; }
.what .wl { display: flex; flex-direction: column; gap: 12px; }
.what .wi { display: flex; gap: 10px; align-items: flex-start; }
.what .wi > .ic { width: 18px; height: 18px; color: var(--primary); margin-top: 2px; }
.what .wi b { display: block; font-size: 13px; font-weight: 600; } .what .wi span { display: block; font-size: 12.5px; color: var(--muted); }
.mini { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.mini > div { display: flex; gap: 8px; align-items: center; font-size: 12.5px; min-width: 0; }
.mini > div > span:nth-child(2) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.warnline { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--warn-ink); background: var(--warn-bg); padding: 8px 10px; border-radius: 8px; }
.warnline .ic { width: 15px; height: 15px; margin-top: 2px; }

/* Bandeja del lider */
.rq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); overflow: hidden; }
.rq.urg { border-left: 4px solid var(--approval); }
.rq-h { display: flex; gap: 12px 16px; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
.rq-b { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 0 16px 14px; }
.rq-f { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line-2); background: var(--surface-2); flex-wrap: wrap; }
.rq-f input { flex: 1 1 260px; }
.big { font-size: 22px; font-weight: 600; line-height: 1.1; }
.mine { background: color-mix(in srgb, var(--primary-soft) 60%, var(--surface)); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.mine small { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* Centro de Planeacion */

  /* ---------- dialogo ---------- */
  function ask(o) { ui.dlg = o; renderDlg(); }

  /* ---------- render ---------- */
  function render() {
    var T0 = tabs(); if (!T0.some(function (t) { return t[0] === ui.tab; })) ui.tab = 'inicio';
    var sy = window.scrollY;
    var head = '<div class="head"><div><h1>Solicitudes y novedades</h1><p>Boceto para discutir, fuera del prototipo. Vacaciones, permisos, compensatorios, incapacidades y licencias, conectados con Reservas, Ejecución y Forecast.</p></div><div class="head-r"><span class="boceto">Boceto · iteración 1</span>' + asSwitch() + '<button class="btn ghost sm" data-a="reset" title="Vuelve a los datos de ejemplo">' + ic('i-undo') + 'Restablecer ejemplo</button></div></div>';
    var tb = '<nav class="tabs" role="tablist">' + T0.map(function (t) { return '<button role="tab" aria-selected="' + (ui.tab === t[0]) + '" data-a="tab" data-v="' + t[0] + '">' + t[1] + (t[2] ? '<span class="count' + (t[0] === 'lider' ? ' ap' : '') + '">' + t[2] + '</span>' : '') + '</button>'; }).join('') + '</nav>';
    var v = { inicio: vInicio, nueva: vNueva, mias: vMias, lider: vLider, plan: vPlan, impacto: vImpacto, reglas: vReglas }[ui.tab];
    var body; try { body = v(); } catch (e) { body = '<div class="empty">Algo falló en esta vista: ' + esc(e.message) + '</div>'; }
    var fk = document.activeElement && document.activeElement.id;
    app.innerHTML = head + tb + body;
    if (fk && $(fk)) { var el = $(fk); el.focus(); try { if (el.setSelectionRange && el.type === 'text') el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
    window.scrollTo(0, sy);
  }
  function setTab(t) { ui.tab = t; try { history.replaceState(null, '', '#' + t); } catch (e) {} render(); window.scrollTo(0, 0); }

  /* ---------- eventos ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.dataset.a, v = b.dataset.v, id = b.dataset.id, r = id ? byId(id) : null;
    switch (a) {
      case 'tab': setTab(v); break;
      case 'as': setAs(v); break;
      case 'go': toast('En Kairos, este botón abriría ' + ({ reservas: 'Reservas', ejecucion: 'Ejecución', forecast: 'Forecast y Backlog', horasextra: 'Horas extra' }[v] || v) + '.'); break;
      case 'new': ui.nw = nwDefault(v); setTab('nueva'); break;
      case 'nwtype': var keep = ui.nw ? ui.nw.for : ME; ui.nw = nwDefault(v); ui.nw.for = keep; render(); break;
      case 'nwsub': ui.nw.sub = v; render(); break;
      case 'nwpart': ui.nw.part = v; render(); break;

      case 'openmine': if (ui.tab !== 'mias') { ui.open = {}; ui.open[id] = true; setTab('mias'); } else { ui.open[id] = !ui.open[id]; render(); } break;
      case 'attach': r.support = 'ok'; if (T[r.type].kind === 'nov') r.state = 'validacion'; else if (r.state === 'registrada') r.state = 'validacion'; hist(r, ME, 'Adjuntó el soporte.'); save(); render(); toast('Soporte adjunto. Gestión Humana lo valida.'); break;
      case 'accept': r.from = r.proposal.from; r.to = r.proposal.to; r.wd = work(r.from, r.to).length; r.impacts = impactsFor(r.person, r.from, r.to).map(function (im) { im.vb = im.leader === r.person ? 'self' : 'ok'; return im; }); r.state = 'aprobada'; hist(r, ME, 'Aceptó las fechas propuestas: ' + rng(r.from, r.to) + '.'); r.proposal = null; save(); render(); toast('Vacaciones aprobadas del ' + rng(r.from, r.to) + '.'); break;
      case 'cancel': ask({ title: 'Cancelar la solicitud', text: typeName(r) + ' · ' + rng(r.from, r.to) + '. Kairos avisa a los líderes y a Planeación.', ok: 'Cancelar solicitud', danger: true, fn: function () { r.state = 'cancelada'; hist(r, ME, 'Canceló la solicitud.'); save(); render(); toast('Solicitud cancelada.'); } }); break;
      case 'vbok': vb(id, 'ok'); break;
      case 'vbobs': vb(id, 'obs'); break;
      case 'impgo': ui.imp = id; ui.after = true; setTab('impacto'); break;
      case 'sel': ui.sel = id; render(); if (window.innerWidth < 1150) { var p = document.querySelector('.pnl'); if (p) p.scrollIntoView({ block: 'start' }); } break;
      case 'plf': ui.plf = v; ui.sel = null; render(); break;
      case 'approve':
        var pend = r.impacts.filter(function (im) { return im.vb === 'pend'; });
        pend.forEach(function (im) { im.vb = 'silent'; });
        r.state = 'aprobada'; hist(r, ME, 'Aprobó.' + (pend.length ? ' ' + pend.map(function (x) { return x.leader; }).join(', ') + ' no respondió: sin objeción.' : ''));
        save(); render(); toast('Aprobada. Se liberan ' + h(r.impacts.reduce(function (s, x) { return s + x.h; }, 0)) + ' de reserva y se precarga ' + T[r.type].intc + ' en Ejecución.'); break;
      case 'adjust': ask({ title: 'Proponer otras fechas', text: r.person + ' recibe la propuesta y decide si la acepta.', dates: [X.add(r.from, 7), X.add(r.to, 7)], input: 'Motivo para ' + r.person.split(' ')[0], ok: 'Enviar propuesta', fn: function (o) { r.proposal = { from: o.from, to: o.to, by: ME, t: o.txt }; r.state = 'ajuste'; hist(r, ME, 'Propuso otras fechas: ' + rng(o.from, o.to) + '.'); save(); render(); toast('Propuesta enviada a ' + r.person + '.'); } }); break;
      case 'reject': ask({ title: 'Rechazar la solicitud', text: 'El motivo le llega a ' + r.person + ' y a los líderes.', input: 'Motivo (obligatorio)', ok: 'Rechazar', danger: true, fn: function (o) { r.state = 'rechazada'; hist(r, ME, 'Rechazó: ' + o.txt); save(); render(); toast('Solicitud rechazada.'); } }); break;
      case 'validate': r.state = 'validada'; r.support = 'ok'; hist(r, ME, 'Validó el soporte.'); save(); render(); toast('Soporte validado.'); break;
      case 'remind': hist(r, ME, 'Recordó adjuntar el soporte.'); save(); render(); toast('Recordatorio enviado a ' + r.person + '.'); break;
      case 'after': ui.after = v === '1'; render(); break;
      case 'reset': ask({ title: 'Restablecer el ejemplo', text: 'Vuelven las solicitudes de ejemplo del boceto y se pierde lo que simulaste.', ok: 'Restablecer', danger: true, fn: function () { db = seed(); save(); ui.sel = null; ui.open = {}; render(); toast('Datos de ejemplo restablecidos.'); } }); break;
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('#ov [data-a]'); if (!b) return;
    var d = ui.dlg; if (!d) return;
    if (b.dataset.a === 'dno') { ui.dlg = null; renderDlg(); return; }

    if (d.input && /obligatorio|Motivo/.test(d.input) && o.txt.length < 5) { $('dErr').hidden = false; return; }
    ui.dlg = null; renderDlg(); d.fn(o);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ui.dlg) { ui.dlg = null; renderDlg(); } });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.obs) { ui.obs[t.dataset.obs] = t.value; return; }
    if (t.dataset.nw && ui.nw && t.tagName === 'TEXTAREA') { ui.nw[t.dataset.nw] = t.value; return; }
    if (t.dataset.nw === 'hrs') { ui.nw.hrs = t.value; return; }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;

  });
  window.addEventListener('hashchange', function () { var h0 = (location.hash || '').slice(1); if (h0 && h0 !== ui.tab) { ui.tab = h0; render(); } });

  render();
})();
