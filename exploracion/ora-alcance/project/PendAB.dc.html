<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ORA · Opción A con punto de pendiente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#0a58eb}a:hover{color:#002473}
button:focus-visible,textarea:focus-visible{outline:2px solid #0a58eb;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; color: #001c3f; background: #ffffff; font-size: 14px; display: flex; flex-direction: column">
  <header style="padding: 12px 16px 14px; border-bottom: 1px solid #eef2f6; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #dbe2ea; background: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#001c3f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <div style="flex: 1; min-width: 0"><div style="font-size: 12px; color: #556578">Proceso 2 de 4</div><div style="font-weight: 600; line-height: 1.3">Medición fiscal y custodia (LACT)</div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #e3e9f0; overflow: hidden"><span style="display: block; height: 100%; width: {{barW}}; background: {{barBg}}"></span></span>
      <span role="img" aria-label="{{progress}}" title="{{progress}}" style="width: 30px; height: 30px; border-radius: 50%; background: {{badgeBg}}; color: #ffffff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none"><sc-if value="{{left}}" hint-placeholder-val="{{ true }}">{{left}}</sc-if><sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
    </div>
  </header>
  <div style="padding: 8px 10px 24px; display: flex; flex-direction: column">
    <button type="button" style="font: inherit; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 8px; min-height: 60px; border: 0;  background: transparent; color: #001c3f">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #556578">¿Por qué entra en la evaluación?</span><span style="font-size: 15px">Custodia en el cargue de buques.</span></span>
      <span style="font-size: 13px; font-weight: 500; color: #0a58eb">Editar</span>
    </button>
    <button type="button" style="font: inherit; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 8px; min-height: 60px; border: 0; border-top: 1px solid #eef2f6; background: transparent; color: #001c3f">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #556578">¿Qué tan crítico es para el negocio?</span><span style="font-size: 15px">Alta</span></span>
      <span style="font-size: 13px; font-weight: 500; color: #0a58eb">Editar</span>
    </button>
    <sc-if value="{{typeDone}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{typeEdit}}" style="font: inherit; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 8px; min-height: 60px; border: 0; border-top: 1px solid #eef2f6; background: transparent; color: #001c3f">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #556578">¿Qué tipo de proceso es?</span><span style="font-size: 15px">{{typeVal}}</span></span>
        <span style="font-size: 13px; font-weight: 500; color: #0a58eb">Editar</span>
      </button>
    </sc-if>
    <sc-if value="{{typeOpen}}" hint-placeholder-val="{{ true }}">
      <div style="border-top: 1px solid #eef2f6; padding: 16px 8px; display: flex; flex-direction: column; gap: 10px">
        <span style="display: flex; align-items: center; gap: 10px"><sc-if value="{{typePending}}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; border-radius: 50%; background: #c77700; flex: none" aria-hidden="true"></span></sc-if><span style="font-size: 15px; font-weight: 600">¿Qué tipo de proceso es?</span></span>
        <div role="radiogroup" aria-label="Tipo de proceso" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{typeOpts}}" as="o" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="font: inherit; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; min-height: 56px; border-radius: 10px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: #001c3f"><b style="font-weight: 600">{{o.label}}</b><span style="font-size: 12px; color: #556578">{{o.help}}</span></button>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{intDone}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{intEdit}}" style="font: inherit; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 8px; min-height: 60px; border: 0; border-top: 1px solid #eef2f6; background: transparent; color: #001c3f">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #556578">¿Qué pasa si se detiene?</span><span style="font-size: 15px">{{intVal}}</span></span>
        <span style="font-size: 13px; font-weight: 500; color: #0a58eb">Editar</span>
      </button>
    </sc-if>
    <sc-if value="{{intOpen}}" hint-placeholder-val="{{ true }}">
      <div style="border-top: 1px solid #eef2f6; padding: 16px 8px; display: flex; flex-direction: column; gap: 10px">
        <span style="display: flex; align-items: center; gap: 10px"><sc-if value="{{intPending}}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; border-radius: 50%; background: #c77700; flex: none" aria-hidden="true"></span></sc-if><span style="font-size: 15px; font-weight: 600">¿Qué pasa si se detiene?</span></span>
        <span style="position: relative; display: block"><textarea rows="2" aria-label="Qué pasa si se detiene" placeholder="Escriba o toque el micrófono" value="{{draft}}" onChange="{{onDraft}}" style="font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; padding: 12px 48px 12px 12px; border-radius: 10px; border: 1px solid #b9c6d6; color: #001c3f"></textarea><button type="button" aria-label="Dictar" style="position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a58eb" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button></span>
        <button type="button" onClick="{{saveInt}}" style="font: inherit; font-weight: 600; min-height: 48px; border-radius: 10px; border: 0; background: {{saveBg}}; color: #ffffff">Guardar</button>
      </div>
    </sc-if>
    <sc-if value="{{tolDone}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{tolEdit}}" style="font: inherit; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 8px; min-height: 60px; border: 0; border-top: 1px solid #eef2f6; background: transparent; color: #001c3f">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #556578">¿Cuánto tiempo puede estar detenido?</span><span style="font-size: 15px">{{tolVal}}</span></span>
        <span style="font-size: 13px; font-weight: 500; color: #0a58eb">Editar</span>
      </button>
    </sc-if>
    <sc-if value="{{tolOpen}}" hint-placeholder-val="{{ true }}">
      <div style="border-top: 1px solid #eef2f6; padding: 16px 8px; display: flex; flex-direction: column; gap: 10px">
        <span style="display: flex; align-items: center; gap: 10px"><sc-if value="{{tolPending}}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; border-radius: 50%; background: #c77700; flex: none" aria-hidden="true"></span></sc-if><span style="font-size: 15px; font-weight: 600">¿Cuánto tiempo puede estar detenido?</span></span><span style="font-size: 13px; color: #556578; margin-top: -4px">Antes de que el impacto sea inaceptable.</span>
        <div role="radiogroup" aria-label="Tiempo" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{tolOpts}}" as="o" hint-placeholder-count="6">
            <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="font: inherit; font-size: 15px; font-weight: 500; min-height: 48px; border-radius: 24px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.ink}}">{{o.label}}</button>
          </sc-for>
        </div>
        <button type="button" style="font: inherit; align-self: flex-start; min-height: 40px; padding: 0; border: 0; background: transparent; color: #0a58eb; font-weight: 500">Otro valor</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: { type: '', int: '', tol: '' }, open: { type: true, int: true, tol: true }, draft: '' }; }
  renderVals() {
    var self = this, st = this.state, v = st.v;
    var set = function (k, val) { var nv = Object.assign({}, self.state.v); nv[k] = val; var no = Object.assign({}, self.state.open); no[k] = false; self.setState({ v: nv, open: no }); };
    var edit = function (k) { return function () { var no = Object.assign({}, self.state.open); no[k] = true; self.setState({ open: no, draft: k === 'int' ? self.state.v.int : self.state.draft }); }; };
    var typeOpts = [['Productivo', 'Genera el producto o servicio'], ['Servicio auxiliar', 'Apoya a otros procesos'], ['Salvaguarda', 'Protege personas y planta']].map(function (o) {
      var on = v.type === o[0]; return { label: o[0], help: o[1], checked: on ? 'true' : 'false', border: on ? '#002473' : '#b9c6d6', bg: on ? '#eef3fd' : '#ffffff', pick: function () { set('type', o[0]); } }; });
    var tolOpts = ['30 min', '1 h', '2 h', '4 h', '8 h', '24 h'].map(function (l) {
      var on = v.tol === l; return { label: l, checked: on ? 'true' : 'false', border: on ? '#002473' : '#b9c6d6', bg: on ? '#002473' : '#ffffff', ink: on ? '#ffffff' : '#001c3f', pick: function () { set('tol', l); } }; });
    var left = ['type', 'int', 'tol'].filter(function (k) { return !v[k]; }).length;
    var r = { typeOpts: typeOpts, tolOpts: tolOpts, draft: st.draft,
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      saveInt: function () { if (self.state.draft.trim()) set('int', self.state.draft.trim()); },
      saveBg: st.draft.trim() ? '#002473' : '#7d8fa8',
      progress: left ? left + (left === 1 ? ' pregunta por responder' : ' preguntas por responder') : 'Obligatorias completas',
      left: left, allDone: !left, badgeBg: left ? '#a65f00' : '#1d7a4a',
      barW: Math.round((5 - left) / 5 * 100) + '%', barBg: left ? '#0a58eb' : '#1d7a4a' };
    ['type', 'int', 'tol'].forEach(function (k) {
      r[k + 'Done'] = !!v[k] && !st.open[k]; r[k + 'Open'] = !v[k] || st.open[k]; r[k + 'Pending'] = !v[k];
      r[k + 'Val'] = k === 'tol' ? (v[k] ? 'Tolera ' + v[k] : '') : v[k]; r[k + 'Edit'] = edit(k); });
    return r;
  }
}
</script>
</body>
</html>
