<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ORA · Alcance, lista de procesos (celular)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f2f5f9}
a{color:#0a58eb}a:hover{color:#002473}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; color: #001c3f; background: #f2f5f9; font-size: 14px; display: flex; flex-direction: column">
  <header style="background: #ffffff; border-bottom: 1px solid #dbe2ea; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="Abrir menú" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #dbe2ea; background: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#001c3f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <div style="flex: 1">
      <div style="font-size: 12px; color: #556578">Etapa 1 de 6</div>
      <h1 style="margin: 0; font-size: 18px; font-weight: 600">Alcance</h1>
    </div>
    <button type="button" style="font: inherit; font-size: 13px; padding: 0 14px; height: 44px; border-radius: 8px; border: 1px solid #9fdbe6; background: #e6f8fb; color: #002473">Dictar</button>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div role="tablist" aria-label="Partes del alcance" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #e3e9f0; padding: 4px; border-radius: 12px">
      <button type="button" role="tab" aria-selected="false" style="font: inherit; font-size: 13px; min-height: 44px; border-radius: 9px; border: 0; background: transparent; color: #556578">Cliente y equipo</button>
      <button type="button" role="tab" aria-selected="true" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 44px; border-radius: 9px; border: 0; background: #ffffff; color: #002473; box-shadow: 0 1px 3px rgba(0,28,63,.12)">Procesos críticos</button>
    </div>

    <button type="button" style="font: inherit; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 12px; border: 1.5px solid #0a58eb; background: #f4f8ff; color: #001c3f">
      <span style="font-size: 12px; font-weight: 600; color: #0a58eb">Sigue aquí</span>
      <span style="font-size: 16px; font-weight: 600">¿Cuánto tiempo puede estar detenida la medición fiscal (LACT)?</span>
      <span style="font-size: 13px; color: #556578">Es la última respuesta que falta en ese proceso.</span>
    </button>

    <section aria-label="Por decidir" style="background: #ffffff; border: 1px solid #dbe2ea; border-radius: 12px">
      <div style="padding: 14px 16px 4px; font-weight: 600">Por decidir</div>
      <button type="button" style="font: inherit; width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px 16px 14px; min-height: 56px; border: 0; background: transparent; color: #001c3f">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Alivio de transitorios</span><span style="font-size: 12px; color: #556578">¿El terminal tiene skid de alivio propio?</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556578" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </section>

    <section aria-label="En la evaluación" style="background: #ffffff; border: 1px solid #dbe2ea; border-radius: 12px">
      <div style="padding: 14px 16px 4px; font-weight: 600">En la evaluación</div>
      <sc-for list="{{procs}}" as="p" hint-placeholder-count="4">
        <button type="button" style="font: inherit; width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px 16px; min-height: 64px; border: 0; border-top: 1px solid #eef2f6; background: transparent; color: #001c3f">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
            <span style="font-weight: 500">{{p.name}}</span>
            <span style="display: flex; align-items: center; gap: 8px">
              <span style="flex: 1; height: 4px; border-radius: 2px; background: #e3e9f0; overflow: hidden"><span style="display: block; height: 100%; width: {{p.pct}}; background: {{p.bar}}"></span></span>
              <span style="font-size: 12px; color: {{p.countInk}}; white-space: nowrap">{{p.count}}</span>
            </span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556578" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </section>

    <button type="button" style="font: inherit; text-align: left; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #556578">3 descartados: 2 no aplican y 1 queda fuera del alcance</button>
    <button type="button" style="font: inherit; font-weight: 500; min-height: 44px; border-radius: 8px; border: 1px dashed #b9c6d6; background: transparent; color: #0a58eb">Agregar un proceso de la instalación</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var procs = [
      { name: 'Bombeo principal e impulsión', n: 6 },
      { name: 'Medición fiscal y custodia (LACT)', n: 5 },
      { name: 'Parada de emergencia (SIS / ESD / F&G)', n: 3 },
      { name: 'Almacenamiento y balance de crudo', n: 5 }
    ].map(function (p) {
      var full = p.n === 6;
      return { name: p.name, count: full ? 'Completo' : p.n + ' de 6', countInk: full ? '#1d7a4a' : '#556578', pct: Math.round(p.n / 6 * 100) + '%', bar: full ? '#1d7a4a' : '#0a58eb' };
    });
    return { procs: procs };
  }
}
</script>
</body>
</html>
