<title>Boceto ORA · Cadena de valor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
/* Layout: shell ORA/Kairos (barra lateral navy + cabecera con selector de assessment) y panel omnIA a la derecha, igual que en Kairos.
   Tokens idénticos al artefacto ORA v13 y a Kairos Ecosistema (omnIA). */
:root {
  --font: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --navy: #001c3f; --navy-2: #00285a; --bright: #0a58eb; --cyan: #00dcfa; --violet: #7543ff;
  --bg: #f2f5f9; --surface: #fff; --surface-2: #f6f8fb; --ink: #001c3f; --muted: #556578; --line: #dbe2ea; --line-2: #eef2f6;
  --primary: #002473; --primary-ink: #fff; --primary-soft: #e8eefc; --focus: #0a58eb;
  --ok-bg: #e5f7ee; --ok-ink: #145a37; --warn-bg: #fff4e0; --warn-ink: #7a4a00; --err-bg: #fbeaeb; --err-ink: #b0353c; --err: #b0353c;
  --approval: #7543ff; --approval-soft: #f1ecff; --off-bg: #e9edf2; --off-ink: #6b7a8d;
  --info-bg: #e8f4ff; --info-ink: #0a4a9e; --bubble-user: #002473; --bubble-user-ink: #fff; --panel-w: 400px;
  --side-ink: #c9d6e6; --side-muted: #7d93ae; --side-active: rgba(0,220,250,.12);
  --shadow: 0 12px 32px rgba(0,28,63,.18); --shadow-sm: 0 2px 8px rgba(0,28,63,.08);
  --r-ctl: 8px; --r-surf: 12px;
  --lv-high: #c2353d; --lv-high-bg: #fbeaeb; --lv-med: #c77700; --lv-med-bg: #fff4e0; --lv-low: #1d7a4a; --lv-low-bg: #e5f7ee; --lv-pend: #6b7a8d; --lv-pend-bg: #eef1f5;
  --s-mant: #1d7a4a; --s-mant-bg: #e5f7ee; --s-est: #0a58eb; --s-est-bg: #e8eefc; --s-act: #c77700; --s-act-bg: #fff4e0; --s-mig: #7543ff; --s-mig-bg: #f1ecff;
  --tol: #b0353c; --rec: #0a58eb; --grid: #e3e9f0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80; --err: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #8597ad; --info-bg: #10284a; --info-ink: #9cc6ff; --bubble-user: #2f5fd0;
  --navy: #020c1a; --navy-2: #061a33; --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
  --lv-high: #ff7a80; --lv-high-bg: #3d1519; --lv-med: #ffc061; --lv-med-bg: #3a2a0c; --lv-low: #7fdcaa; --lv-low-bg: #0e3324; --lv-pend: #9db0c5; --lv-pend-bg: #172a43;
  --s-mant: #7fdcaa; --s-mant-bg: #0e3324; --s-est: #7fb0ff; --s-est-bg: #16294a; --s-act: #ffc061; --s-act-bg: #3a2a0c; --s-mig: #a98bff; --s-mig-bg: #221a45;
  --tol: #ff7a80; --rec: #7fb0ff; --grid: #1d3253; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80; --err: #ff7a80;
  --approval: #a98bff; --approval-soft: #221a45; --off-bg: #132439; --off-ink: #8597ad; --info-bg: #10284a; --info-ink: #9cc6ff; --bubble-user: #2f5fd0;
  --navy: #020c1a; --navy-2: #061a33; --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
  --lv-high: #ff7a80; --lv-high-bg: #3d1519; --lv-med: #ffc061; --lv-med-bg: #3a2a0c; --lv-low: #7fdcaa; --lv-low-bg: #0e3324; --lv-pend: #9db0c5; --lv-pend-bg: #172a43;
  --s-mant: #7fdcaa; --s-mant-bg: #0e3324; --s-est: #7fb0ff; --s-est-bg: #16294a; --s-act: #ffc061; --s-act-bg: #3a2a0c; --s-mig: #a98bff; --s-mig-bg: #221a45;
  --tol: #ff7a80; --rec: #7fb0ff; --grid: #1d3253; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; }
.mut { color: var(--muted); } .small { font-size: 12.5px; }

/* shell */
.shell { height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.side { background: var(--navy); color: var(--side-ink); display: flex; flex-direction: column; gap: 18px; padding: 22px 14px; overflow-y: auto; min-width: 0; }
.side-logo { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.side-logo img { height: 24px; width: auto; }
.side-logo .wm { font-size: 14px; color: #fff; font-weight: 300; border-left: 1px solid rgba(201,214,230,.2); padding-left: 10px; line-height: 1.15; }
.side-logo .wm b { color: var(--cyan); font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); padding: 10px 12px 6px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: var(--r-ctl); color: var(--side-ink); font-size: 14px; text-align: left; position: relative; }
.nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav button[aria-current="page"] { background: var(--side-active); color: #fff; font-weight: 500; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--cyan); }
.nav small { margin-left: auto; font-size: 10.5px; color: var(--side-muted); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(201,214,230,.12); padding-top: 12px; }
.s-omnia { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border-radius: var(--r-ctl); color: var(--side-ink); text-align: left; min-height: 50px; }
.s-omnia:hover, .s-omnia[aria-pressed="true"] { background: var(--side-active); color: #fff; }
.s-orb { width: 24px; height: 24px; border-radius: 50%; flex: none; background: radial-gradient(circle at 40% 35%, #00dcfa 0, #0a58eb 38%, #001c3f 78%); box-shadow: 0 0 0 2px rgba(0,220,250,.25); }
.s-lbl { display: flex; flex-direction: column; line-height: 1.25; } .s-lbl b { color: #fff; font-weight: 600; font-size: 13.5px; } .s-lbl small { font-size: 11.5px; color: var(--side-muted); }
.side-ver { font-size: 11px; color: var(--side-muted); padding: 6px 12px 0; }

.work { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.top { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: 24px; padding-right: 24px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 64px; flex-wrap: wrap; }
.crumb { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.crumb small { font-size: 12px; color: var(--muted); }
.crumb select { font-size: 16px; font-weight: 600; border: 1px solid transparent; border-radius: var(--r-ctl); background: transparent; padding: 2px 6px 2px 0; max-width: 100%; color: var(--ink); }
.crumb select:hover { border-color: var(--line); }
.top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.icon-btn { width: 40px; height: 40px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.stage { flex: 1; display: flex; min-height: 0; position: relative; }
.main { flex: 1; min-width: 0; overflow-y: auto; padding-block: 24px 110px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.main-in { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* common */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--off-bg); color: var(--off-ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); } .pill.warn { background: var(--warn-bg); color: var(--warn-ink); } .pill.err { background: var(--err-bg); color: var(--err-ink); }
.pill.pri { background: var(--primary-soft); color: var(--primary); } .pill.vio { background: var(--approval-soft); color: var(--approval); }
.pill.demo { background: var(--warn-bg); color: var(--warn-ink); border: 1px dashed var(--warn-ink); }
.pill.nv { background: var(--navy); color: #fff; }
.lv { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 10px 2px 8px; border-radius: 999px; white-space: nowrap; }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.lv.Alto { background: var(--lv-high-bg); color: var(--lv-high); } .lv.Medio { background: var(--lv-med-bg); color: var(--lv-med); } .lv.Bajo { background: var(--lv-low-bg); color: var(--lv-low); }
.lv.Pendiente { background: var(--lv-pend-bg); color: var(--lv-pend); } .lv.Pendiente::before { background: repeating-linear-gradient(45deg, currentColor 0 2px, transparent 2px 4px); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 10px; border-radius: 6px; white-space: nowrap; }
.st.mantener { background: var(--s-mant-bg); color: var(--s-mant); } .st.estabilizar { background: var(--s-est-bg); color: var(--s-est); } .st.actualizar { background: var(--s-act-bg); color: var(--s-act); } .st.migrar { background: var(--s-mig-bg); color: var(--s-mig); }
.st small { font-weight: 400; opacity: .8; }
.tag { display: inline-flex; font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink); white-space: nowrap; }
button.tag:hover { border-color: var(--bright); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-ctl); font-size: 13px; font-weight: 500; white-space: nowrap; min-height: 38px; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--bright); } .btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); } .btn.sm { min-height: 32px; padding: 5px 11px; font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--line); min-height: 38px; }
.seg button:first-child { border-left: 0; } .seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); min-width: 0; }
.box-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line-2); }
.box-head h2, .box-head h3 { font-size: 15.5px; font-weight: 600; }
.box-head p { width: 100%; font-size: 12.5px; color: var(--muted); margin-top: -2px; }
.box-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.sec-title { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; padding: 10px 14px; border-radius: var(--r-ctl); background: var(--primary-soft); color: var(--primary); }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.hello { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hello h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; } .hello p { color: var(--muted); max-width: 72ch; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi small { font-size: 12px; color: var(--muted); font-weight: 500; } .kpi b { font-size: 24px; font-weight: 600; line-height: 1.15; } .kpi span { font-size: 11.5px; color: var(--muted); }
.av { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex: none; border: 2px solid var(--surface); }
.av { position: relative; } .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stack { display: inline-flex; } .stack .av { margin-left: -8px; } .stack .av:first-child { margin-left: 0; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 34px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-surf); }
.empty b { color: var(--ink); font-weight: 600; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 16px; color: #fff; padding: 22px 24px; display: grid; gap: 14px; background: linear-gradient(100deg, rgba(0,28,63,.97) 0%, rgba(0,28,63,.9) 55%, rgba(0,36,115,.7) 100%), #001c3f url(assets/bg-home.jpg) center / cover; }
.hero .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); font-weight: 500; }
.hero h1 { font-size: 26px; font-weight: 300; letter-spacing: -.01em; } .hero h1 b { font-weight: 600; }
.hero p { color: #c3d0e1; max-width: 70ch; font-size: 13.5px; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: #c3d0e1; }
.chain span { padding: 4px 11px; border: 1px solid rgba(183,198,218,.3); border-radius: 999px; } .chain i { width: 12px; height: 1px; background: rgba(0,220,250,.6); }

/* ejemplos */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); min-height: 34px; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-width: 0; }
.acard.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.acard header { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 6px; }
.acard header .row1 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.acard h3 { font-size: 15.5px; font-weight: 600; line-height: 1.3; } .acard .cl { font-size: 12px; color: var(--muted); }
.steps7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 0 16px; }
.steps7 i { height: 5px; border-radius: 3px; background: var(--line-2); } .steps7 i.d { background: var(--bright); } .steps7 i.c { background: var(--cyan); }
.acard .stt { padding: 8px 16px 0; font-size: 12.5px; }
.acard .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 16px; }
.acard .nums div { display: flex; flex-direction: column; } .acard .nums b { font-size: 17px; font-weight: 600; } .acard .nums span { font-size: 11px; color: var(--muted); }
.acard footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line-2); background: var(--surface-2); border-radius: 0 0 14px 14px; }

/* cadena */
.promises { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.prom { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.prom .n { display: flex; gap: 8px; align-items: center; } .prom .n i { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: var(--cyan); font-style: normal; font-weight: 600; font-size: 12px; display: grid; place-items: center; flex: none; }
.prom h3 { font-size: 13.5px; font-weight: 600; line-height: 1.25; } .prom .en { font-size: 11px; color: var(--muted); }
.prom .big { font-size: 22px; font-weight: 600; line-height: 1.1; } .prom .big small { font-size: 12px; font-weight: 400; color: var(--muted); }
.prom ul.pl { list-style: none; padding-left: 0; } .prom ul { margin: 0; padding-left: 16px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.prom .ui { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line-2); padding-top: 8px; margin-top: auto; }
.gap-l li { color: var(--warn-ink); }
.hilo { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.tstep { border: 1px solid var(--line); border-radius: var(--r-surf); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); position: relative; min-width: 0; }
.tstep .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tstep b { font-size: 13px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; } .tstep p { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tstep:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 14px; color: var(--muted); font-size: 14px; }

/* evaluación */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { padding: 10px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--bright); }
.cov { display: flex; flex-direction: column; }
.cov-row { display: grid; grid-template-columns: minmax(0, 1.2fr) 120px minmax(0, 1.6fr); gap: 12px; align-items: start; padding: 12px 18px; border-top: 1px solid var(--line-2); }
.cov-row:first-child { border-top: 0; } .cov-row b { font-weight: 600; font-size: 13.5px; } .cov-row .src { font-size: 12px; color: var(--muted); }
.cov-row .g { font-size: 12.5px; }
.cs.revisado { background: var(--ok-bg); color: var(--ok-ink); } .cs.en-curso { background: var(--primary-soft); color: var(--primary); } .cs.no-revisado { background: var(--warn-bg); color: var(--warn-ink); } .cs.no-aplica { background: var(--off-bg); color: var(--off-ink); }
details.scn { border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); }
details.scn > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 16px; }

    if (t.dataset.close && (e.target === t || t.classList.contains('icon-btn'))) { $('#layer').innerHTML = ''; return; }
    if (t.dataset.view) return go(t.dataset.view);
    if (t.dataset.ind) { S.ind = t.dataset.ind; return render(); }
    if (t.dataset.open) { S.id = t.dataset.open; save(); return go(t.dataset.to); }
    if (t.dataset.tab) { S.tab = t.dataset.tab; if (t.dataset.go) return go(t.dataset.go); return render(); }
    if (t.dataset.rm) { S.rm = t.dataset.rm; return render(); }
    if (t.dataset.iv) return ivModal(t.dataset.iv);
    if (t.id === 'omniaBtn' || t.id === 'sideOmnia') { S.panel = !S.panel; return renderPanel(); }
    if (t.dataset.hact === 'close') { S.panel = false; return renderPanel(); }
    if (t.dataset.sug) return reply(t.dataset.sug);
    if (t.dataset.ai) {
      var a = cur(), d = t.dataset.do, p = a.ai.find(function (x) { return x.id === t.dataset.ai; });
      if (d === 'editar') { toast('En la versión final abre el escenario en borrador para editarlo.'); return; }
      S.aiState[a.id + p.id] = d;
      if (d !== 'por revisar') th().push({ who: 'event', text: p.id + ': ' + d + ' por ' + uname(a.leadId) + '. ' + (d === 'aceptada como borrador' ? 'Queda como borrador; la evaluación no cambia hasta que lo apruebes.' : d === 'descartada' ? 'Se conserva la propuesta y el motivo en el historial.' : 'Se crea una tarea de verificación.') });
      return renderPanel();
    }
    if (t.id === 'oSend') { var i = $('#oInput'); if (i.value.trim()) { reply(i.value.trim()); i.value = ''; } return; }
    if (t.id === 'themeBtn') { var r = document.documentElement, dk = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dk ? 'light' : 'dark'; return; }
  });
  $('#asSel').addEventListener('change', function (e) { S.id = e.target.value; save(); if (S.view === 'ejemplos') S.view = 'cadena'; go(S.view); });
  $('#oInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#oSend').click(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('#layer').innerHTML) $('#layer').innerHTML = ''; else if (S.panel) { S.panel = false; renderPanel(); } } });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (VIEWS.indexOf(h) > -1 && h !== S.view) { S.view = h; render(); } });
  if (window.OmniaOrb) { fabOrb = new window.OmniaOrb($('#fabOrb')); }
  render();
})();
</script>

</body></html>
